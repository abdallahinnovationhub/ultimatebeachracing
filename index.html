<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Beach Racing 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071321;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{width:100vw;height:100vh;display:block}
#hud{position:absolute;top:10px;left:10px;right:10px;display:none;justify-content:space-between;pointer-events:none;gap:8px}
.panel{background:#071321dd;border:1px solid #42c8ff;border-radius:12px;padding:10px}
#controls{position:absolute;bottom:15px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px}
button{background:#087dbb;color:white;border:1px solid #72d9ff;border-radius:12px;padding:12px 17px;font-weight:bold;font-size:14px}
button:active{background:#e49b16}
.control{width:65px;height:65px;border-radius:50%;font-size:23px;touch-action:none}
#menu{position:absolute;inset:0;background:linear-gradient(#03101bdc,#061c2eee);display:flex;align-items:center;justify-content:center;overflow:auto}
.box{width:min(95%,600px);max-height:95%;overflow:auto;background:#10283c;border:2px solid #20a9e8;border-radius:20px;padding:20px;text-align:center}
h1{color:#44ceff;font-size:27px}
h2{color:#ffd15a}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.option{background:#173e59;border:1px solid #4dbef0;border-radius:10px;padding:12px}
.option small{display:block;color:#c1d9e7;margin-top:5px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
#message{font-size:13px;color:#bdeaff}
#nitro{background:#163b55;border-radius:10px;height:13px;overflow:hidden;margin-top:6px}
#nitroFill{height:100%;width:100%;background:#ffae25}
#raceResult{font-size:18px;color:#ffe18a}
@media(max-width:500px){
 .box{padding:13px}
 h1{font-size:22px}
 button{padding:10px;font-size:12px}
 .control{width:58px;height:58px}
}
</style>
</head>
<body>

<div id="game"></div>

<div id="hud">
 <div class="panel">
  <b id="levelText">LEVEL 1</b><br>
  <span id="positionText">Position: 1/8</span><br>
  <span id="lapText">Lap: 1/3</span>
 </div>
 <div class="panel">
  <b id="speedText">0 KM/H</b><br>
  <span id="coinText">Coins: 0</span><br>
  <span id="timeText">Time: 0</span>
  <div id="nitro"><div id="nitroFill"></div></div>
 </div>
</div>

<div id="controls">
 <div>
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div>
  <button class="control" id="brake">▼</button>
  <button class="control" id="gas">▲</button>
  <button class="control" id="turbo">⚡</button>
 </div>
</div>

<div id="menu">
 <div class="box">
  <h1>🏁 ULTIMATE BEACH RACING 3D</h1>
  <p>Drive. Race. Upgrade. Become the champion.</p>
  <h2 id="menuTitle">MAIN MENU</h2>
  <div id="menuContent">
   <div class="row">
    <button onclick="showCars()">🚘 GARAGE</button>
    <button onclick="showTracks()">🛣️ TRACKS</button>
   </div>
   <div class="row">
    <button onclick="startRace('quick')">QUICK RACE</button>
    <button onclick="startRace('championship')">CHAMPIONSHIP</button>
   </div>
   <div class="row">
    <button onclick="startRace('time')">TIME TRIAL</button>
    <button onclick="showUpgrades()">UPGRADES</button>
   </div>
   <p id="message">Choose your car and track. Your progress is saved.</p>
  </div>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87c9e9);
scene.fog=new THREE.Fog(0x87c9e9,100,350);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);

scene.add(new THREE.HemisphereLight(0xffffff,0x546b45,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(40,70,30);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1000,1000),
 new THREE.MeshStandardMaterial({color:0x347a42})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.2;
ground.receiveShadow=true;
scene.add(ground);

const cars=[
 {name:"Tesla Model S Plaid",color:0xeeeeee,speed:43,accel:1.2},
 {name:"Dodge Challenger",color:0xb90020,speed:40,accel:1.4},
 {name:"Ferrari SF90",color:0xe60000,speed:46,accel:1.3},
 {name:"Lamborghini Revuelto",color:0xffd21d,speed:47,accel:1.4},
 {name:"Porsche 911 GT3",color:0xffffff,speed:44,accel:1.3},
 {name:"Bugatti Chiron",color:0x0752be,speed:49,accel:1.2},
 {name:"McLaren 750S",color:0xff7b00,speed:46,accel:1.5},
 {name:"BMW M4",color:0x1763c4,speed:41,accel:1.3},
 {name:"Nissan GT-R",color:0x555555,speed:42,accel:1.4},
 {name:"Mercedes AMG GT",color:0x222222,speed:43,accel:1.3}
];

const tracks=[
 {name:"Beach Circuit",a:75,b:48,curve:.15,color:0xb9a06b},
 {name:"Mountain Road",a:72,b:45,curve:.35,color:0x777777},
 {name:"Desert Highway",a:90,b:45,curve:.08,color:0xc6a16b},
 {name:"Jungle Circuit",a:68,b:50,curve:.28,color:0x5d7e4b},
 {name:"City Circuit",a:76,b:42,curve:.22,color:0x555b66},
 {name:"Snow Circuit",a:80,b:48,curve:.13,color:0xcbd9e5}
];

let selectedCar=0,selectedTrack=0;
let mode="quick",level=1,coins=Number(localStorage.coins||0);
let upgrades=JSON.parse(localStorage.upgrades||'{"engine":0,"turbo":0,"tyres":0,"brakes":0}');
let unlocked=Number(localStorage.unlocked||1);
let player,opponents=[],trackCurve,trackLength=0;
let progress=0,offset=0,speed=0,nitro=100;
let running=false,paused=false,finished=false;
let elapsed=0,lastTime=0;
let steering=0,accelerating=false,braking=false,boosting=false;
let cameraMode=0,lapTarget=3,finishReward=0;
let roadWidth=13;
let trackObjects=[];

function save(){
 localStorage.coins=coins;
 localStorage.upgrades=JSON.stringify(upgrades);
 localStorage.unlocked=unlocked;
}

function makeCar(index,ai=false){
 const group=new THREE.Group();
 const color=ai?cars[index%cars.length].color:cars[selectedCar].color;

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(3.1,1,5.7),
  new THREE.MeshStandardMaterial({color,metalness:.65,roughness:.25})
 );
 body.position.y=1;
 body.castShadow=true;
 group.add(body);

 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(2.35,.95,2.65),
  new THREE.MeshStandardMaterial({color:0x152d3d,metalness:.5,roughness:.2})
 );
 cabin.position.set(0,1.85,-.3);
 group.add(cabin);

 const glass=new THREE.MeshStandardMaterial({
  color:0x5f9fb9,metalness:.6,roughness:.15
 });
 const wind=new THREE.Mesh(new THREE.BoxGeometry(2.2,.65,.12),glass);
 wind.position.set(0,1.8,1.05);
 group.add(wind);

 for(const x of [-1.55,1.55]){
  for(const z of [-1.8,1.8]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.65,.65,.4,16),
    new THREE.MeshStandardMaterial({color:0x111111})
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.62,z);
   group.add(wheel);
  }
 }

 const lightMat=new THREE.MeshBasicMaterial({color:0xffffff});
 for(const x of [-.9,.9]){
  const light=new THREE.Mesh(new THREE.BoxGeometry(.5,.2,.08),lightMat);
  light.position.set(x,1,2.86);
  group.add(light);
 }
 scene.add(group);
 return group;
}

function makeTrack(){
 for(const o of trackObjects)scene.remove(o);
 trackObjects=[];
 const t=tracks[selectedTrack];
 const points=[];
 for(let i=0;i<100;i++){
  const a=i/100*Math.PI*2;
  const wave=Math.sin(a*3)*t.curve*12+
              Math.sin(a*5)*t.curve*5;
  points.push(new THREE.Vector3(
   (t.a+wave)*Math.cos(a),
   0,
   (t.b+wave*.6)*Math.sin(a)
  ));
 }
 trackCurve=new THREE.CatmullRomCurve3(points,true,"catmullrom",.4);
 trackLength=trackCurve.getLength();

 const segments=700;
 const verts=[],indices=[];
 for(let i=0;i<=segments;i++){
  const u=i/segments;
  const p=trackCurve.getPointAt(u);
  const tangent=trackCurve.getTangentAt(u);
  const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();
  for(const s of [-1,1]){
   const v=p.clone().addScaledVector(side,s*roadWidth/2);
   verts.push(v.x,.03,v.z);
  }
  if(i<segments){
   const n=i*2;
   indices.push(n,n+1,n+2,n+1,n+3,n+2);
  }
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
 geo.setIndex(indices);
 geo.computeVertexNormals();

 const road=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
  color:t.color,side:THREE.DoubleSide,roughness:.9
 }));
 road.receiveShadow=true;
 scene.add(road);
 trackObjects.push(road);

 // Road edge markings
 for(let i=0;i<140;i++){
  const u=i/140;
  const p=trackCurve.getPointAt(u);
  const tan=trackCurve.getTangentAt(u);
  const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  for(const s of [-1,1]){
   const mark=new THREE.Mesh(
    new THREE.BoxGeometry(.5,.08,.5),
    new THREE.MeshStandardMaterial({color:0xffffff})
   );
   mark.position.copy(p).addScaledVector(side,s*(roadWidth/2+.35));
   mark.position.y=.1;
   scene.add(mark);
   trackObjects.push(mark);
  }
 }

 // Track scenery
 for(let i=0;i<110;i++){
  const u=i/110;
  const p=trackCurve.getPointAt(u);
  const tan=trackCurve.getTangentAt(u);
  const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  for(const s of [-1,1]){
   const tree=new THREE.Group();
   const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.35,.5,3,7),
    new THREE.MeshStandardMaterial({color:0x68452b})
   );
   trunk.position.y=1.5;
   tree.add(trunk);
   const leaves=new THREE.Mesh(
    new THREE.ConeGeometry(2,5,8),
    new THREE.MeshStandardMaterial({color:0x176d34})
   );
   leaves.position.y=4.5;
   tree.add(leaves);
   tree.position.copy(p).addScaledVector(side,s*(roadWidth/2+7+Math.random()*12));
   scene.add(tree);
   trackObjects.push(tree);
  }
 }
}

function placeOnTrack(car,u,lateral=0){
 const p=trackCurve.getPointAt(((u%1)+1)%1);
 const tan=trackCurve.getTangentAt(((u%1)+1)%1);
 const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
 car.position.copy(p).addScaledVector(side,lateral);
 car.position.y=.1;
 car.rotation.y=Math.atan2(tan.x,tan.z);
}

function clearRace(){
 if(player)scene.remove(player);
 opponents.forEach(c=>scene.remove(c.mesh));
 opponents=[];
}

function startRace(selectedMode){
 mode=selectedMode;
 if(mode==="championship")level=Math.min(level,5);
 else level=1;

 clearRace();
 makeTrack();

 player=makeCar(selectedCar);
 progress=0;offset=0;speed=0;nitro=100;
 elapsed=0;finished=false;paused=false;
 lapTarget=mode==="time"?1:3;

 const count=mode==="championship"?15:8;
 for(let i=0;i<count;i++){
  const mesh=makeCar((i+1)%cars.length,true);
  opponents.push({
   mesh,
   progress:-.008-i*.006,
   speed:.037+Math.random()*.012
  });
 }

 placeOnTrack(player,0,0);
 running=true;
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="flex";
 document.getElementById("controls").style.display="flex";
 document.getElementById("levelText").textContent=
  mode.toUpperCase()+" - LEVEL "+level;
 lastTime=performance.now();
}

function update(dt){
 if(!running||paused||finished)return;

 elapsed+=dt;
 const spec=cars[selectedCar];
 const maxSpeed=spec.speed+
  upgrades.engine*3;
 const acceleration=spec.accel+
  upgrades.engine*.1;

 if(accelerating)speed+=acceleration*dt*2;
 else speed-=dt*1.8;
 if(braking)speed-=dt*6;

 if(boosting&&nitro>0&&speed>1){
  speed+=dt*15*(1+upgrades.turbo*.12);
  nitro=Math.max(0,nitro-dt*28);
 }else{
  nitro=Math.min(100,nitro+dt*5);
 }

 speed=THREE.MathUtils.clamp(speed,0,maxSpeed+25);
 const steerPower=(.09+speed*.003)*(1+upgrades.tyres*.06);
 offset+=steering*steerPower*dt*8;
 offset=THREE.MathUtils.clamp(offset,-8,8);

 if(Math.abs(offset)>roadWidth/2-1){
  speed=Math.max(0,speed-dt*8);
 }

 const speedFactor=speed/Math.max(1,maxSpeed);
 progress+=speedFactor*dt*.055;
 placeOnTrack(player,progress,offset);

 opponents.forEach((ai,i)=>{
  ai.progress+=ai.speed*dt*(1+level*.025);
  placeOnTrack(ai.mesh,ai.progress,Math.sin(elapsed+i)*1.3);
 });

 const lap=Math.min(lapTarget,Math.floor(progress)+1);
 document.getElementById("lapText").textContent=
  "Lap: "+lap+"/"+lapTarget;
 document.getElementById("speedText").textContent=
  Math.round(speed*5)+" KM/H";
 document.getElementById("coinText").textContent="Coins: "+coins;
 document.getElementById("timeText").textContent=
  "Time: "+elapsed.toFixed(1)+"s";
 document.getElementById("nitroFill").style.width=nitro+"%";

 const ranking=1+opponents.filter(a=>a.progress>progress).length;
 document.getElementById("positionText").textContent=
  "Position: "+ranking+"/"+(opponents.length+1);

 if(progress>=lapTarget)endRace(ranking);
}

function endRace(position){
 if(finished)return;
 finished=true;
 running=false;

 let reward=0;
 if(position===1)reward=mode==="championship"?1000:500;
 else if(position===2)reward=mode==="championship"?600:250;
 else if(position===3)reward=mode==="championship"?350:150;
 else reward=50;

 if(mode==="time")reward=position===1?300:50;
 coins+=reward;

 if(mode==="championship"&&position===1){
  unlocked=Math.max(unlocked,level+1);
  save();
 }

 save();
 document.getElementById("controls").style.display="none";
 document.getElementById("hud").style.display="none";
 document.getElementById("menu").style.display="flex";
 document.getElementById("menuTitle").textContent=
  position===1?"🏆 RACE WON!":"RACE FINISHED";
 document.getElementById("menuContent").innerHTML=`
  <div id="raceResult">
   <h2>${position===1?"CHAMPION!":"FINISH!"}</h2>
   <p>Position: ${position}/${opponents.length+1}</p>
   <p>Time: ${elapsed.toFixed(2)} seconds</p>
   <p>Reward: +${reward} coins</p>
   <p>Total coins: ${coins}</p>
  </div>
  <div class="row">
   <button onclick="startRace('${mode}')">RACE AGAIN</button>
   <button onclick="nextLevel()">NEXT LEVEL</button>
   <button onclick="mainMenu()">MAIN MENU</button>
  </div>`;
}

window.nextLevel=()=>{
 if(mode==="championship"){
  if(level<5&&unlocked>=level+1)level++;
  else if(level>=5)level=1;
 }
 startRace(mode);
};

window.mainMenu=()=>{
 running=false;
 document.getElementById("menu").style.display="flex";
 document.getElementById("hud").style.display="none";
 document.getElementById("controls").style.display="none";
 document.getElementById("menuTitle").textContent="MAIN MENU";
 showMain();
};

function showMain(){
 document.getElementById("menuContent").innerHTML=`
 <p>Available coins: ${coins}</p>
 <div class="row">
 <button onclick="showCars()">🚘 GARAGE</button>
 <button onclick="showTracks()">🛣️ TRACKS</button>
 </div>
 <div class="row">
 <button onclick="startRace('quick')">QUICK RACE</button>
 <button onclick="startRace('championship')">CHAMPIONSHIP</button>
 </div>
 <div class="row">
 <button onclick="startRace('time')">TIME TRIAL</button>
 <button onclick="showUpgrades()">UPGRADES</button>
 </div>
 <p id="message">Championship unlocked level: ${unlocked}</p>`;
}

window.showCars=()=>{
 document.getElementById("menuTitle").textContent="CAR GARAGE";
 let html='<div class="grid">';
 cars.forEach((c,i)=>{
  html+=`<div class="option">
  <b>${c.name}</b><small>Top speed: ${c.speed}</small>
  <button onclick="selectCar(${i})">${selectedCar===i?"SELECTED":"SELECT"}</button>
  </div>`;
 });
 html+='</div><button onclick="mainMenu()">BACK</button>';
 document.getElementById("menuContent").innerHTML=html;
};

window.selectCar=i=>{
 selectedCar=i;
 showCars();
};

window.showTracks=()=>{
 document.getElementById("menuTitle").textContent="CHOOSE YOUR ROAD";
 let html='<div class="grid">';
 tracks.forEach((t,i)=>{
  html+=`<div class="option"><b>${t.name}</b>
  <button onclick="selectTrack(${i})">
  ${selectedTrack===i?"SELECTED":"SELECT"}
  </button></div>`;
 });
 html+='</div><button onclick="mainMenu()">BACK</button>';
 document.getElementById("menuContent").innerHTML=html;
};

window.selectTrack=i=>{
 selectedTrack=i;
 showTracks();
};

window.showUpgrades=()=>{
 const names={engine:"Engine",turbo:"Super Turbo",tyres:"Tyres",brakes:"Brakes"};
 let html='<div class="grid">';
 for(const key in names){
  const cost=300+(upgrades[key]||0)*250;
  html+=`<div class="option"><b>${names[key]}</b>
  <small>Level ${upgrades[key]||0}</small>
  <small>Upgrade cost: ${cost} coins</small>
  <button onclick="buyUpgrade('${key}')">UPGRADE</button>
  </div>`;
 }
 html+='</div><p>Coins: '+coins+'</p><button onclick="mainMenu()">BACK</button>';
 document.getElementById("menuContent").innerHTML=html;
};

window.buyUpgrade=key=>{
 const cost=300+(upgrades[key]||0)*250;
 if(coins>=cost){
  coins-=cost;
  upgrades[key]++;
  save();
  showUpgrades();
 }else{
  alert("You need more coins!");
 }
};

window.startRace=startRace;
window.showCars=showCars;
window.showTracks=showTracks;
window.showUpgrades=showUpgrades;

function setControl(id,fn){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();fn(true);
 });
 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  el.addEventListener(event,()=>fn(false));
 });
}
setControl("left",v=>steering=v?-1:0);
setControl("right",v=>steering=v?1:0);
setControl("gas",v=>accelerating=v);
setControl("brake",v=>braking=v);
setControl("turbo",v=>boosting=v);

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000,.04);
 lastTime=now;
 update(dt);

 if(player){
  const p=player.position;
  const direction=new THREE.Vector3(
   Math.sin(player.rotation.y),0,Math.cos(player.rotation.y)
  );
  let desired;
  if(cameraMode===0){
   desired=p.clone().addScaledVector(direction,-13).add(new THREE.Vector3(0,7,0));
   camera.position.lerp(desired,.1);
   camera.lookAt(p.x,p.y+1,p.z);
  }else if(cameraMode===1){
   desired=p.clone().add(new THREE.Vector3(0,100,.01));
   camera.position.lerp(desired,.1);
   camera.lookAt(p.x,0,p.z);
  }else{
   desired=p.clone().add(new THREE.Vector3(30,30,30));
   camera.position.lerp(desired,.1);
   camera.lookAt(p.x,0,p.z);
  }
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")steering=-1;
 if(e.key==="ArrowRight"||e.key==="d")steering=1;
 if(e.key==="ArrowUp"||e.key==="w")accelerating=true;
 if(e.key==="ArrowDown"||e.key==="s")braking=true;
 if(e.key===" ")boosting=true;
 if(e.key==="c")cameraMode=(cameraMode+1)%3;
});
window.addEventListener("keyup",e=>{
 if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))steering=0;
 if(["ArrowUp","w"].includes(e.key))accelerating=false;
 if(["ArrowDown","s"].includes(e.key))braking=false;
 if(e.key===" ")boosting=false;
});
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

showMain();
</script>
</body>
</html>
