<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ultimate Beach Racing 3D</title>
<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;background:#071522;color:white;font-family:Arial;overflow:hidden}
#game{position:fixed;inset:0}
canvas{display:block}
button{border:0;border-radius:12px;padding:12px 17px;font-weight:bold;background:#ffc52e;color:#17212b;font-size:15px}
button:active{transform:scale(.93)}
#menu{position:absolute;inset:0;z-index:5;background:linear-gradient(145deg,#06213d,#087e91);display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;padding:12px;overflow:auto}
h1{color:#ffdc52;font-size:clamp(28px,6vw,55px);text-shadow:0 4px 10px #000}
#menu p{color:#e3faff}
.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:8px}
#hud{display:none;position:absolute;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:9px;gap:5px}
.box{background:#00182dcc;padding:9px 12px;border-radius:10px;font-size:13px}
#controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 15px}
.group{display:flex;gap:9px;pointer-events:auto}
.control{width:65px;height:65px;border-radius:50%;font-size:25px;background:#ffffffcc;border:3px solid white;touch-action:none}
#gas{background:#20c66b}
#brake{background:#ee4b4b}
#nitro{background:#258cff}
#actions{position:absolute;right:10px;top:70px;pointer-events:auto;display:flex;flex-direction:column}
#actions button{margin:3px;padding:9px}
#message{position:absolute;top:35%;width:100%;text-align:center;font-size:38px;font-weight:bold;color:#ffe04b;text-shadow:0 3px 8px black}
#rotate{display:none;position:absolute;inset:0;background:#061522;z-index:20;align-items:center;justify-content:center;text-align:center;font-size:24px}
@media(orientation:portrait){#rotate{display:flex}}
.small{font-size:12px;color:#cceeff}
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">📱<br>Rotate your phone to landscape mode</div>

<div id="menu">
<h1>🏎️ ULTIMATE<br>BEACH RACING 3D</h1>
<p>THE ULTIMATE KART RACING ADVENTURE</p>
<div class="row">
<button onclick="chooseCar(0)">🔴 RED RACER</button>
<button onclick="chooseCar(1)">🔵 BLUE SPEED</button>
<button onclick="chooseCar(2)">🟡 GOLDEN GT</button>
</div>
<p id="carName">Selected: Red Racer</p>
<div class="row">
<button onclick="chooseMode('Quick Race')">QUICK RACE</button>
<button onclick="chooseMode('Championship')">CHAMPIONSHIP</button>
<button onclick="chooseMode('Time Trial')">TIME TRIAL</button>
</div>
<p id="modeName">Mode: Quick Race</p>
<div class="row">
<button onclick="upgrade()">🔧 UPGRADE CAR</button>
<button onclick="toggleMusic()">🔊 SOUND ON/OFF</button>
</div>
<p id="coinsMenu">🪙 Coins: 0</p>
<button onclick="startGame()" style="font-size:21px;padding:15px 35px">▶ START RACING</button>
<p class="small">Beach • Desert • Jungle • Racing • Nitro • AI</p>
</div>

<div id="hud">
<div class="top">
<div class="box">🏁 POSITION <span id="position">1</span>/5</div>
<div class="box">⚡ <span id="speed">0</span> KM/H</div>
<div class="box">LAP <span id="lap">1</span>/3</div>
<div class="box">🪙 <span id="coins">0</span></div>
</div>
<div id="message"></div>
<div id="actions">
<button onclick="changeCamera()">📷 CAMERA</button>
<button onclick="pauseGame()">Ⅱ PAUSE</button>
<button onclick="usePower()">✨ POWER</button>
</div>
<div id="controls">
<div class="group">
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>
</div>
<div class="group">
<button class="control" id="brake">▼</button>
<button class="control" id="gas">▲</button>
<button class="control" id="nitro">⚡</button>
</div>
</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

let scene,camera,renderer,player;
let opponents=[],coins=[],powerups=[];
let running=false,paused=false,finished=false;
let speed=0,steering=0,lap=1,coinsCollected=0;
let playerAngle=0,trackRadius=45;
let selectedCar=0,mode='Quick Race',cameraMode=0;
let upgradeLevel=0,powerReady=true,soundOn=true;
let gas=false,brake=false,left=false,right=false,nitro=false;
let previousAngle=0,lastTime=0,raceTime=0;
let totalCoins=Number(localStorage.getItem('ubrCoins')||0);
let clock=new THREE.Clock();
let soundContext=null;

const colors=[0xe83232,0x168bff,0xffc52e];
const names=['Red Racer','Blue Speed','Golden GT'];

function chooseCar(i){
 selectedCar=i;
 document.getElementById('carName').textContent='Selected: '+names[i];
}

function chooseMode(m){
 mode=m;
 document.getElementById('modeName').textContent='Mode: '+m;
}

function updateCoins(){
 document.getElementById('coinsMenu').textContent='🪙 Coins: '+totalCoins;
}

function upgrade(){
 if(totalCoins<50){
  alert('You need 50 coins to upgrade your car.');
  return;
 }
 totalCoins-=50;
 upgradeLevel=Math.min(upgradeLevel+1,5);
 localStorage.setItem('ubrCoins',totalCoins);
 updateCoins();
 alert('Car upgraded! Speed level: '+upgradeLevel);
}

function toggleMusic(){
 soundOn=!soundOn;
 alert(soundOn?'Sound enabled':'Sound disabled');
}

function beep(frequency=500){
 if(!soundOn)return;
 try{
  soundContext ||= new AudioContext();
  const oscillator=soundContext.createOscillator();
  const gain=soundContext.createGain();
  oscillator.frequency.value=frequency;
  oscillator.connect(gain);
  gain.connect(soundContext.destination);
  gain.gain.setValueAtTime(.08,soundContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,soundContext.currentTime+.18);
  oscillator.start();
  oscillator.stop(soundContext.currentTime+.18);
 }catch(e){}
}

function makeMat(color,roughness=.7){
 return new THREE.MeshStandardMaterial({color,roughness});
}

function createCar(color){
 const car=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.7,.8,4.4),
  new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.35})
 );
 body.position.y=.9;
 car.add(body);

 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(1.9,.85,1.9),
  makeMat(0x17364d,.2)
 );
 cabin.position.set(0,1.65,-.25);
 car.add(cabin);

 const glass=new THREE.Mesh(
  new THREE.BoxGeometry(1.7,.55,.08),
  new THREE.MeshStandardMaterial({color:0x9deaff,transparent:true,opacity:.7})
 );
 glass.position.set(0,1.7,.73);
 car.add(glass);

 const wheels=[];
 for(const x of [-1.45,1.45]){
  for(const z of [-1.4,1.4]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.56,.56,.4,20),
    makeMat(0x101010)
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.55,z);
   car.add(wheel);
   wheels.push(wheel);
  }
 }
 car.userData.wheels=wheels;

 const spoiler=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,.15,.5),
  makeMat(0x181818)
 );
 spoiler.position.set(0,1.5,-2);
 car.add(spoiler);

 return car;
}

function createWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x76c9e9);
 scene.fog=new THREE.Fog(0x76c9e9,100,250);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.getElementById('game').appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x52734b,1.7));

 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(40,70,30);
 sun.castShadow=true;
 scene.add(sun);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  makeMat(0xd7bc80)
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.15;
 scene.add(ground);

 createTrack();
 createScenery();
}

function createTrack(){
 const road=new THREE.Mesh(
  new THREE.RingGeometry(trackRadius-7.5,trackRadius+7.5,160),
  makeMat(0x444444)
 );
 road.rotation.x=-Math.PI/2;
 road.position.y=.02;
 scene.add(road);

 const grass=new THREE.Mesh(
  new THREE.CircleGeometry(trackRadius-7.5,100),
  makeMat(0x64a44b)
 );
 grass.rotation.x=-Math.PI/2;
 grass.position.y=0;
 scene.add(grass);

 for(let i=0;i<160;i++){
  const a=i/160*Math.PI*2;
  for(const r of [trackRadius-7.5,trackRadius+7.5]){
   const curb=new THREE.Mesh(
    new THREE.BoxGeometry(1.8,.35,.8),
    makeMat(i%2?0xffffff:0xe83232)
   );
   curb.position.set(Math.cos(a)*r,.25,Math.sin(a)*r);
   curb.rotation.y=-a;
   scene.add(curb);
  }
 }

 const line=new THREE.Mesh(
  new THREE.BoxGeometry(15,.08,2),
  makeMat(0xffffff)
 );
 line.position.set(trackRadius,.12,0);
 scene.add(line);
}

function createTree(x,z){
 const tree=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.4,3.5,8),
  makeMat(0x76502b)
 );
 trunk.position.y=1.75;
 tree.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2.4,10,8),
  makeMat(0x167b3d)
 );
 leaves.position.y=4.2;
 tree.add(leaves);
 tree.position.set(x,0,z);
 scene.add(tree);
}

function createScenery(){
 for(let i=0;i<85;i++){
  const a=Math.random()*Math.PI*2;
  const r=65+Math.random()*45;
  createTree(Math.cos(a)*r,Math.sin(a)*r);
 }
}

function createCollectibles(){
 coins=[];
 powerups=[];
 for(let i=0;i<30;i++){
  const a=i/30*Math.PI*2;
  const coin=new THREE.Mesh(
   new THREE.TorusGeometry(.65,.18,8,20),
   new THREE.MeshStandardMaterial({color:0xffd700,metalness:.8})
  );
  coin.position.set(Math.cos(a)*trackRadius,1.5,Math.sin(a)*trackRadius);
  scene.add(coin);
  coins.push(coin);
 }
 for(let i=0;i<5;i++){
  const a=i/5*Math.PI*2+.3;
  const item=new THREE.Mesh(
   new THREE.OctahedronGeometry(.9),
   new THREE.MeshStandardMaterial({color:0x25dfff,emissive:0x075577})
  );
  item.position.set(Math.cos(a)*trackRadius,2,Math.sin(a)*trackRadius);
  scene.add(item);
  powerups.push(item);
 }
}

function placeCar(car,a,r=trackRadius){
 car.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
 car.rotation.y=-a;
}

function createAI(){
 opponents=[];
 const aiColors=[0x168bff,0xff8b20,0x27bb65,0x9c50df];
 for(let i=0;i<4;i++){
  const car=createCar(aiColors[i]);
  car.userData.angle=-.25-i*.23;
  car.userData.speed=.48+Math.random()*.1;
  car.userData.progress=0;
  car.userData.laps=0;
  scene.add(car);
  opponents.push(car);
 }
}

function startGame(){
 if(!scene)createWorld();

 if(player)scene.remove(player);
 player=createCar(colors[selectedCar]);
 scene.add(player);

 opponents.forEach(c=>scene.remove(c));
 createAI();

 coins.forEach(c=>scene.remove(c));
 powerups.forEach(c=>scene.remove(c));
 createCollectibles();

 playerAngle=.15;
 previousAngle=playerAngle;
 speed=0;
 lap=1;
 raceTime=0;
 coinsCollected=0;
 steering=0;
 finished=false;
 paused=false;
 running=true;
 powerReady=true;

 placeCar(player,playerAngle,trackRadius);
 opponents.forEach((c,i)=>placeCar(c,-.4-i*.25,trackRadius+2));

 document.getElementById('menu').style.display='none';
 document.getElementById('hud').style.display='block';
 document.getElementById('message').textContent='3';

 setTimeout(()=>document.getElementById('message').textContent='2',900);
 setTimeout(()=>document.getElementById('message').textContent='1',1800);
 setTimeout(()=>document.getElementById('message').textContent='GO!',2700);
 setTimeout(()=>document.getElementById('message').textContent='',3400);

 beep(400);
 clock.start();
}

function updatePlayer(dt){
 const maxSpeed=75+upgradeLevel*5;

 if(gas)speed+=35*dt;
 else speed-=10*dt;
 if(brake)speed-=50*dt;
 if(nitro && speed>5)speed+=55*dt;

 speed=THREE.MathUtils.clamp(speed,0,maxSpeed);

 let turn=(left?1:0)-(right?1:0);
 steering=THREE.MathUtils.lerp(steering,turn,dt*5);

 const radius=trackRadius+steering*speed*.025;
 const oldAngle=playerAngle;

 playerAngle+=speed/trackRadius*dt*.35;

 if(playerAngle<oldAngle){
  lap++;
 }

 if(lap>3){
  finishRace();
  return;
 }

 placeCar(player,playerAngle,radius);

 player.rotation.y=-playerAngle+steering*.25;

 player.userData.wheels.forEach(w=>w.rotation.x-=speed*dt*.08);

 for(const ai of opponents){
  if(ai.position.distanceTo(player.position)<3.2){
   speed=Math.max(0,speed-20*dt);
  }
 }
}

function updateAI(dt){
 opponents.forEach((car,i)=>{
  const old=car.userData.angle;
  car.userData.angle+=car.userData.speed*dt;
  if(car.userData.angle>Math.PI*2){
   car.userData.angle-=Math.PI*2;
   car.userData.laps++;
  }
  car.userData.progress+=car.userData.speed*dt;
  placeCar(car,car.userData.angle,trackRadius+(i%2?2:-2));
  car.userData.wheels.forEach(w=>w.rotation.x-=dt*5);
 });
}

function updateCollectibles(){
 for(const coin of coins){
  if(!coin.visible)continue;
  coin.rotation.y+=.04;
  if(coin.position.distanceTo(player.position)<3){
   coin.visible=false;
   coinsCollected++;
   totalCoins++;
   localStorage.setItem('ubrCoins',totalCoins);
   document.getElementById('coins').textContent=coinsCollected;
   beep(850);
  }
 }
 for(const item of powerups){
  if(!item.visible)continue;
  item.rotation.y+=.05;
  if(item.position.distanceTo(player.position)<3){
   item.visible=false;
   powerReady=true;
   document.getElementById('message').textContent='POWER-UP READY!';
   beep(1000);
   setTimeout(()=>{
    if(running)document.getElementById('message').textContent='';
   },1000);
  }
 }
}

function usePower(){
 if(!powerReady||!running||paused)return;
 powerReady=false;
 speed=Math.min(speed+35,110);
 document.getElementById('message').textContent='⚡ TURBO BOOST!';
 beep(1100);
 setTimeout(()=>{
  document.getElementById('message').textContent='';
 },1000);
}

function changeCamera(){
 cameraMode=(cameraMode+1)%3;
}

function updateCamera(){
 if(cameraMode===0){
  const offset=new THREE.Vector3(0,6,-12);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
  const target=player.position.clone().add(offset);
  camera.position.lerp(target,.09);
  camera.lookAt(player.position.x,1,player.position.z);
 }else if(cameraMode===1){
  camera.position.set(player.position.x+32,65,player.position.z+32);
  camera.lookAt(player.position);
 }else{
  const offset=new THREE.Vector3(0,3,7);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
  camera.position.copy(player.position).add(offset);
  camera.lookAt(player.position);
 }
}

function updateHUD(){
 document.getElementById('speed').textContent=Math.round(speed*2.5);
 document.getElementById('lap').textContent=Math.min(lap,3);

 const playerProgress=(lap-1)*Math.PI*2+playerAngle;
 let position=1;

 for(const ai of opponents){
  const aiProgress=ai.userData.laps*Math.PI*2+ai.userData.angle;
  if(aiProgress>playerProgress)position++;
 }
 document.getElementById('position').textContent=Math.min(position,5);
}

function finishRace(){
 if(finished)return;
 finished=true;
 running=false;
 const reward=coinsCollected*2+(mode==='Championship'?50:20);
 totalCoins+=reward;
 localStorage.setItem('ubrCoins',totalCoins);
 document.getElementById('message').innerHTML=
 '🏆 RACE FINISHED!<br>Reward: '+reward+' coins<br><button onclick="backToMenu()">MAIN MENU</button>';
 beep(900);
}

function pauseGame(){
 if(!running)return;
 paused=!paused;
 document.getElementById('message').innerHTML=
 paused?'PAUSED<br><button onclick="pauseGame()">RESUME</button>':'';
}

function backToMenu(){
 running=false;
 document.getElementById('hud').style.display='none';
 document.getElementById('menu').style.display='flex';
 document.getElementById('message').textContent='';
 updateCoins();
}

function bind(id,callback){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  callback(true);
 });
 ['pointerup','pointercancel','pointerleave'].forEach(event=>{
  el.addEventListener(event,e=>callback(false));
 });
}

bind('gas',v=>gas=v);
bind('brake',v=>brake=v);
bind('left',v=>left=v);
bind('right',v=>right=v);
bind('nitro',v=>nitro=v);

window.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')gas=true;
 if(e.key==='ArrowDown'||e.key==='s')brake=true;
 if(e.key==='ArrowLeft'||e.key==='a')left=true;
 if(e.key==='ArrowRight'||e.key==='d')right=true;
 if(e.key===' ')nitro=true;
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowUp'||e.key==='w')gas=false;
 if(e.key==='ArrowDown'||e.key==='s')brake=false;
 if(e.key==='ArrowLeft'||e.key==='a')left=false;
 if(e.key==='ArrowRight'||e.key==='d')right=false;
 if(e.key===' ')nitro=false;
});

window.addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(running&&!paused&&!finished){
  raceTime+=dt;
  updatePlayer(dt);
  updateAI(dt);
  updateCollectibles();
  updateCamera();
  updateHUD();
 }
 if(renderer&&scene&&camera)renderer.render(scene,camera);
}

window.chooseCar=chooseCar;
window.chooseMode=chooseMode;
window.upgrade=upgrade;
window.toggleMusic=toggleMusic;
window.startGame=startGame;
window.changeCamera=changeCamera;
window.pauseGame=pauseGame;
window.usePower=usePower;
window.backToMenu=backToMenu;

updateCoins();
animate();
</script>
</body>
</html>
